name: 周期性知识库刷新

# 每周日北京时间 03:00 自动跑一次（UTC 19:00 周六）
on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '抽取模式：section（无 LLM）/ llm（需 secrets.ANTHROPIC_API_KEY）'
        default: 'section'
        type: choice
        options: [section, llm]

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 提交回 nodes.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: 跑采集流水线
        env:
          # LLM 二选一（OpenRouter 优先；都没填 secrets 时 --mode llm 会报错，自动降级到 section）
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XIMING_MODEL: ${{ vars.XIMING_MODEL || 'anthropic/claude-sonnet-4.5' }}
          # 资料获取 AI 工具（可选）
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'section' }}"
          # 没设任何 LLM key 时 --mode llm 会报错；自动降级
          if [ "$MODE" = "llm" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::无 LLM key，自动降级 --mode section"
            MODE="section"
          fi
          python -m ingestion.pipeline --mode "$MODE"
          ls -la data/knowledge/ data/

      - name: 提交知识库更新（nodes.jsonl + manifest）
        run: |
          git config user.name "ximing-ingest-bot"
          git config user.email "actions@github.com"
          # nodes.jsonl 现已入 git（让 clone 即用），跟踪 manifest 反映状态
          git add data/knowledge/nodes.jsonl data/knowledge/pending_review.jsonl data/knowledge/manifest.json
          if git diff --cached --quiet; then
              echo "No changes"
          else
              git commit -m "chore(ingest): 知识库刷新 $(date -u +%Y-%m-%d)"
              git push
          fi

      - name: 上传 nodes.jsonl 为 release asset（每周一份）
        uses: actions/upload-artifact@v4
        with:
          name: ximing-kb-${{ github.run_number }}
          path: |
            data/knowledge/nodes.jsonl
            data/knowledge/pending_review.jsonl
            data/knowledge/manifest.json
          retention-days: 30
